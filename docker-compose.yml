# AgentGuard local development stack
# Usage: docker compose up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard
      POSTGRES_DB: agentguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://agentguard:agentguard@postgres:5432/agentguard
      REDIS_URL: redis://redis:6379/0
      AGENTGUARD_API_KEY: dev-change-me
      REPO_ROOT: /app
      ARTIFACTS_DIR: /app/.agentguard/server-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://agentguard:agentguard@postgres:5432/agentguard
      REDIS_URL: redis://redis:6379/0
      AGENTGUARD_API_KEY: dev-change-me
      REPO_ROOT: /app
      ARTIFACTS_DIR: /app/.agentguard/server-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
